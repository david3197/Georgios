function trs(t,l){const k=t.trim();if(!k)return t;const m=l=='en'?a2e:e2a;
 const one=x=>{if(m[x]!==undefined)return m[x];for(const r of RX){const g=l=='en'?r[0]:r[2];if(g.test(x))return x.replace(g,l=='en'?r[1]:r[3])}return x};
 let r=one(k);if(r==k&&/ • | — /.test(k))r=k.split(/( • | — )/).map(p=>/^( • | — )$/.test(p)?p:one(p)).join('');

  return modal('Privacy',rules.map(x=>`<div class=li><span>${esc(lab(x.split('|')[1]))}: ${esc(aud(S.hide[x]))}</span><button class="btn alt sm" data-a=hdel data-x="${esc(x)}">Unhide</button></div>`).join('')+`<h3>Hide from…</h3><select id=hf>${F.map(z=>`<option value="${esc(z[0])}">${esc(z[1])}</option>`).join('')}</select><select id=hs><option value=k>This child only</option><option value=c>All children in this class</option></select><label><input type=checkbox id=ha>Everyone</label>${classes().map(c=>`<label><input type=checkbox class=hc value="${esc(c)}">${esc(c)}</label>`).join('')}${S.sv.filter(x=>x.id!=ME.id).map(x=>`<label><input type=checkbox class=hp value="${x.id}">${esc(x.name)}</label>`).join('')}`,'Save',()=>{
   const f=$('#hf').value,all=$('#ha').checked,cls=[...document.querySelectorAll('.hc:checked')].map(x=>x.value),ppl=[...document.querySelectorAll('.hp:checked')].map(x=>x.value);
   if(!all&&!cls.length&&!ppl.length){toast('Choose who');return false}
   const o={};(($('#hs').value=='c')?S.kids.filter(x=>x.cls==k.cls):[k]).forEach(x=>o[x.id+'|'+f]={all,cls,ppl,by:ME.id});put('meta/hide',o);toast('Hidden 🔒')})}
 if(d.a=='obback'){const o=V.ob||{s:1};if(o.s<=1){localStorage.removeItem('fam');localStorage.removeItem('famn');return location.reload()}return history.back()}
 if(d.a=='av'){V.ob={s:1,av:+d.i};return draw(true)}
 if(d.a=='g'){const n=($('#nm').value.trim()+' '+(($('#fa')||{}).value||'').trim()).trim();if(!n)return toast('اكتب اسمك الأول');const bd=$('#bd').value;if(!bd)return toast('اكتب عيد ميلادك');if(!V.obp)return toast('ضيف صورتك الأول 📷');const pin=($('#pn')||{}).value||'';if(pin.length<4)return toast('اختار كود شخصي 4 أرقام على الأقل');return sha(pin).then(h=>{V.ob={s:2,n,g:d.g,bd,photo:V.obp,ph:h,av:(V.ob||{}).av};draw(true)})}
 if(d.a=='r'){V.ob.role=d.r;if(d.r=='h')V.ob.s=4;else V.ob.s=3;return draw(true)}
 if(d.a=='pw')return checkPw($('#pw').value);
 if(d.a=='fin'){const c=$('#cl').value.trim();if(!c)return toast('اكتب الفصل');return finish(c)}
 if(d.a=='addkid')return modal('ولد جديد',`<input id=kn placeholder="الاسم بالعربي"><input id=ke placeholder="Name in English"><input id=kc list=kcl placeholder="الفصل" value="${esc(ME.cls||'')}"><datalist id=kcl>${classes().map(c=>`<option value="${esc(c)}">`).join('')}</datalist>`,'إضافة',()=>{
  const n=$('#kn').value.trim(),c=$('#kc').value.trim();if(!n||!c){toast('الاسم والفصل مطلوبين');return false}cref('kids').add({name:n,en:$('#ke').value.trim(),cls:c,created:curWk()})});
 if(d.a=='addcol')return modal('خانة جديدة',`<input id=cn placeholder="اسم الخانة">`,'إضافة',()=>{const n=$('#cn').value.trim();if(!n)return false;put('meta/cols',{list:firebase.firestore.FieldValue.arrayUnion(n)})});
 if(d.a=='addme')return modal('Add task','<input id=tx placeholder="المهمة">','إضافة',()=>{const x=$('#tx').value.trim();if(!x)return false;cref('tasks').add({wk:wkOf(),to:ME.id,text:x,from:ME.name,done:false,at:Date.now(),by:ME.id})});
 if(d.a=='rmt'){const id=d.k,au=!!d.u;return modal('Cancel task?','<p>هتتلغي المهمة دي.</p>','تأكيد',()=>{au?put('tasks/'+id,{off:true}):cref('tasks').doc(id).delete()})}
 if(d.a=='addtask'){const l=ME.role=='l'?S.sv.filter(s=>s.cls==ME.cls):S.sv;
  return modal('Add task to',`<select id=tt>${l.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><input id=tx placeholder="المهمة (تحضير / افتقاد ...)">`,'توزيع',()=>{
  const to=$('#tt').value,x=$('#tx').value.trim();if(!to||!x)return false;cref('tasks').add({wk:wkOf(),to,text:x,from:ME.name,done:false,at:Date.now(),by:ME.id})})}});
document.addEventListener('input',e=>{if(e.target.id=='q'){V.q=e.target.value;applyQ()}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.a=='txt')put('kids/'+t.dataset.k,{[t.dataset.f]:t.value.trim()})});
document.addEventListener('focusout',()=>setTimeout(()=>{if(pend)draw()},60));
</script></body></html>
